[project]
name = "chorus-auth"
version = "0.1.0"
description = "Chorus auth service: registration, login, JWT issuance."
requires-python = ">=3.12"
dependencies = [
    "chorus-shared>=0.1.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
