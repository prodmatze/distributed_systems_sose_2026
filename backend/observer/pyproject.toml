[project]
name = "chorus-observer"
version = "0.1.0"
description = "Chorus observer: aggregates docker/redis/postgres/gateway telemetry onto a Redis Stream and fans it out to dashboards. Deliberately does NOT depend on chorus-shared — it observes from outside."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "redis>=8.0",
    "aiodocker>=0.27.0",
    "asyncpg>=0.29.0",
    "pydantic-settings>=2.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "fakeredis>=2.26",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
