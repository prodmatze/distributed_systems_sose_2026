[project]
name = "chorus-chat"
version = "0.1.0"
description = "Chorus chat service: WebSocket fanout, Redis pub/sub bridge, Postgres-backed history replay."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "redis>=5.0.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
