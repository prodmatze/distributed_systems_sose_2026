events {}

http {
    # Service DNS names resolve via the compose network.
    upstream auth_upstream { server auth:8000; }
    upstream api_upstream  { server api:8000; }
    upstream chat_upstream { server chat:8000; }

    # Echo back the origin only if it's the allowed Next.js dev server.
    map $http_origin $cors_origin {
        default                  "";
        "http://localhost:3000"  $http_origin;
    }

    # WebSocket upgrade: send "Connection: upgrade" for real WS handshakes,
    # "Connection: close" for plain HTTP (e.g. GET /ws/health).
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 80;

        location /auth/ {
            if ($request_method = OPTIONS) {
                add_header 'Access-Control-Allow-Origin'      $cors_origin always;
                add_header 'Access-Control-Allow-Methods'     'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
                add_header 'Access-Control-Allow-Headers'     'Content-Type, Authorization' always;
                add_header 'Access-Control-Allow-Credentials' 'true' always;
                add_header 'Access-Control-Max-Age'           '600' always;
                add_header 'Content-Length' 0;
                add_header 'Content-Type'   'text/plain';
                return 204;
            }

            add_header 'Access-Control-Allow-Origin'      $cors_origin always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;

            proxy_pass http://auth_upstream;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/ {
            if ($request_method = OPTIONS) {
                add_header 'Access-Control-Allow-Origin'      $cors_origin always;
                add_header 'Access-Control-Allow-Methods'     'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
                add_header 'Access-Control-Allow-Headers'     'Content-Type, Authorization' always;
                add_header 'Access-Control-Allow-Credentials' 'true' always;
                add_header 'Access-Control-Max-Age'           '600' always;
                add_header 'Content-Length' 0;
                add_header 'Content-Type'   'text/plain';
                return 204;
            }

            add_header 'Access-Control-Allow-Origin'      $cors_origin always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;

            proxy_pass http://api_upstream;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # WebSocket tier. Matches /ws (handshake) and /ws/health (plain GET).
        location /ws {
            proxy_pass http://chat_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600s;   # keep long-lived sockets open
        }
    }
}
