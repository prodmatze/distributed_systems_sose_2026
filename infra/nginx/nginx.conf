events {}

http {
    # Service DNS names resolve via the compose network.
    upstream auth_upstream { server auth:8000; }
    upstream api_upstream  { server api:8000; }
    # Session affinity for the WebSocket tier. Instead of round-robin, pin every
    # socket from a given user to a fixed chat replica by hashing the client-
    # supplied user id (?uid=). A user stays on one replica across reconnects and
    # new tabs. Routing hint only — never trusted for auth; the chat service still
    # verifies the JWT.
    #
    # Peers are listed explicitly rather than via the round-robin `chat` service
    # name: nginx's hash balancer needs stable, individually-addressable upstreams,
    # but `chat` is a single DNS record that rotates across all replicas, so a hash
    # over it silently degrades to round-robin. These names are what
    # `docker compose --scale chat=3` (project `chorus`) produces — keep the
    # replica count and this list in sync.
    #
    # Plain `hash`, not `consistent`: with few users it spreads them onto
    # distinct replicas (the goal), whereas a consistent ring can collide several
    # users onto one. Trade-off: changing the replica count remaps most users.
    # Switch to `consistent` if you scale at runtime and prefer minimal remapping
    # over even spread. A missing/empty uid falls back to round-robin for that
    # connection (verified empirically) — only authenticated clients matter here
    # and they always send it.
    upstream chat_upstream {
        hash $arg_uid;
        server chorus-chat-1:8000;
        server chorus-chat-2:8000;
        server chorus-chat-3:8000;
    }

    # Echo back the origin only if it's an allowed Next.js dev server
    # (3000 default, 3001 when 3000 is taken by something else).
    map $http_origin $cors_origin {
        default                  "";
        "http://localhost:3000"  $http_origin;
        "http://localhost:3001"  $http_origin;
    }

    # WebSocket upgrade: send "Connection: upgrade" for real WS handshakes,
    # "Connection: close" for plain HTTP (e.g. GET /ws/health).
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # ── observability: structured access log ────────────────────────────
    # One JSON object per request on stdout. The observer tails this via the
    # docker logs API and turns each line into an http.request event.
    # $request_id doubles as the correlation id across the whole stack (it is
    # forwarded to upstreams as X-Request-ID below).
    log_format obs_json escape=json
        '{"ts":"$time_iso8601","request_id":"$request_id",'
        '"method":"$request_method","uri":"$request_uri","status":$status,'
        '"bytes":$body_bytes_sent,"rt":"$request_time",'
        '"upstream":"$upstream_addr","upstream_rt":"$upstream_response_time",'
        '"remote":"$remote_addr"}';
    access_log /dev/stdout obs_json;

    server {
        listen 80;

        location /auth/ {
            if ($request_method = OPTIONS) {
                add_header 'Access-Control-Allow-Origin'      $cors_origin always;
                add_header 'Access-Control-Allow-Methods'     'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
                add_header 'Access-Control-Allow-Headers'     'Content-Type, Authorization' always;
                add_header 'Access-Control-Allow-Credentials' 'true' always;
                add_header 'Access-Control-Max-Age'           '600' always;
                add_header 'Content-Length' 0;
                add_header 'Content-Type'   'text/plain';
                return 204;
            }

            add_header 'Access-Control-Allow-Origin'      $cors_origin always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;

            proxy_pass http://auth_upstream;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID      $request_id;
        }

        location /api/ {
            if ($request_method = OPTIONS) {
                add_header 'Access-Control-Allow-Origin'      $cors_origin always;
                add_header 'Access-Control-Allow-Methods'     'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
                add_header 'Access-Control-Allow-Headers'     'Content-Type, Authorization' always;
                add_header 'Access-Control-Allow-Credentials' 'true' always;
                add_header 'Access-Control-Max-Age'           '600' always;
                add_header 'Content-Length' 0;
                add_header 'Content-Type'   'text/plain';
                return 204;
            }

            add_header 'Access-Control-Allow-Origin'      $cors_origin always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;

            proxy_pass http://api_upstream;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID      $request_id;
        }

        # WebSocket tier. Matches /ws (handshake) and /ws/health (plain GET).
        location /ws {
            proxy_pass http://chat_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID      $request_id;
            proxy_read_timeout 3600s;   # keep long-lived sockets open
        }
    }
}
