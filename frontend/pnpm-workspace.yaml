# Single-package project. pnpm 10 treats the presence of this file as a
# workspace root and refuses to run ANY script (`pnpm dev`, `pnpm build`,
# `pnpm test`, `pnpm exec`) with "packages field missing or empty" unless
# it is declared. The file has to stay, because ignoredBuiltDependencies
# below lives here.
packages:
  - .

ignoredBuiltDependencies:
  - sharp
  - unrs-resolver
